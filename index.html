<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>سجل الاشتراكات والشرائح المتقدم</title>
<style>
:root {
  --bg: #0d1419; --surface: #161f28; --surface-card: #1c2733; --surface-2: #22303d;
  --fg: #e6edf3; --muted: #8b9aab; --line: #2a3846;
  --accent: #4fb3d1; --accent-fg: #062029; --accent-soft: #14323d;
  --on: #6fd49a; --on-bg: #14341f; --hold: #f0c261; --hold-bg: #3a2c0c; --off: #f08a8a; --off-bg: #3d1a1a;
  --danger: #f2877f; --gold: #e8b64a; --gold-bg: #3a2e0c;
  --purple: #a892e8; --purple-bg: #2a2340; --dup: #f08a4a; --dup-bg: #3d220a;
  --shadow: 0 12px 36px rgba(0,0,0,.55);
  --font: system-ui, "Segoe UI", Roboto, Tahoma, sans-serif;
  --mono: ui-monospace, Consolas, "Roboto Mono", monospace;
}
:root[data-theme="light"] {
  --bg: #eef2f7; --surface: #ffffff; --surface-card: #ffffff; --surface-2: #f5f8fb;
  --fg: #16212b; --muted: #5d6d7c; --line: #d9e2ec;
  --accent: #0e7fa8; --accent-fg: #ffffff; --accent-soft: #dff1f8;
  --on: #187a47; --on-bg: #ddf5e6; --hold: #8a6100; --hold-bg: #fdf2d4; --off: #b0332f; --off-bg: #fce4e3;
  --danger: #c0392b; --gold: #a57300; --gold-bg: #fdf3d6;
  --purple: #6b4fbf; --purple-bg: #ece7fa; --dup: #c2650a; --dup-bg: #fceadb;
  --shadow: 0 12px 36px rgba(15,30,50,.14);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; padding: 14px; padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 920px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); padding-block: 8px 12px; display: grid; gap: 10px; }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.title-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
.sub { color: var(--muted); font-size: .76rem; margin-top: 1px; }
.btns { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.icon-btn { width: 42px; height: 42px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; color: var(--fg); position: relative; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn.accent { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.icon-btn .dot { position: absolute; top: -3px; inset-inline-end: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff; font-size: .65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid var(--bg); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 500; font-size: .85rem; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.purple { background: var(--purple); color: #fff; border-color: var(--purple); font-weight: 600; }
.btn.sm { padding: 5px 10px; font-size: .78rem; }

.toolbar { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; display: inline-flex; gap: 6px; align-items: center; font-size: .84rem; color: var(--muted); }
.tab b { font-family: var(--mono); font-weight: 600; font-size: .76rem; background: var(--bg); border: 1px solid var(--line); padding: 1px 7px; border-radius: 999px; }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tab[aria-pressed="true"] b { color: inherit; background: rgba(0,0,0,.15); }
.tab.alert-tab { border-color: var(--danger); color: var(--danger); }
.tab.alert-tab[aria-pressed="true"] { background: var(--danger); color: #fff; }

.search { position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 42px 11px 16px; font-size: .95rem; color: var(--fg); }
.search .search-icon { position: absolute; inset-inline-end: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .clear-btn { position: absolute; inset-inline-start: 10px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; color: var(--muted); display: none; align-items: center; justify-content: center; font-size: .9rem; }
.search .clear-btn.show { display: flex; }

.sort-select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; font-size: .82rem; color: var(--fg); cursor: pointer; }

.grid { display: grid; gap: 12px; margin-top: 12px; }
@media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface-card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; position: relative; animation: cardIn .25s ease both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card.clean { border-inline-start: 4px solid var(--on); }
.card.active { border-inline-start: 4px solid var(--accent); }
.card.suspended { border-inline-start: 4px solid var(--hold); }
.card.disconnected { border-inline-start: 4px solid var(--off); }
.card.urgent { border-color: var(--danger); background: color-mix(in srgb, var(--off-bg) 20%, var(--surface-card)); }

.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.phone-wrap { display: flex; align-items: center; gap: 8px; }
.phone-lg { font-family: var(--mono); font-size: 1.15rem; font-weight: 700; direction: ltr; letter-spacing: .4px; }
.copy-btn { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; font-size: .78rem; flex-shrink: 0; }
.copy-btn:hover { color: var(--accent); border-color: var(--accent); }

.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: .76rem; font-weight: 600; white-space: nowrap; }
.badge.clean { background: var(--on-bg); color: var(--on); }
.badge.active { background: var(--accent-soft); color: var(--accent); }
.badge.suspended { background: var(--hold-bg); color: var(--hold); }
.badge.disconnected { background: var(--off-bg); color: var(--off); }
.badge.company { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.badge.alert { background: var(--off-bg); color: var(--danger); font-weight: 700; }
.badge-tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-inline-start: auto; }

.card-body { display: grid; gap: 4px; font-size: .9rem; }
.name-row { font-weight: 600; font-size: 1.02rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sim-row { font-family: var(--mono); font-size: .8rem; color: var(--muted); direction: ltr; }
.notes-box { font-size: .8rem; color: var(--muted); margin-top: 3px; padding: 6px 9px; background: color-mix(in srgb, var(--line) 30%, transparent); border-radius: 8px; line-height: 1.45; }

.date-row { font-size: .84rem; color: var(--fg); border-top: 1px solid var(--line); padding-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.date-val { font-family: var(--mono); direction: ltr; color: var(--muted); }
.card-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.action-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: .78rem; font-weight: 500; color: var(--fg); display: inline-flex; align-items: center; gap: 4px; }
.action-btn.wa { border-color: var(--on); color: var(--on); background: color-mix(in srgb, var(--on-bg) 35%, transparent); }
.action-btn.call { border-color: var(--accent); color: var(--accent); }
.action-btn.edit { border-color: var(--line); color: var(--muted); }

.empty { padding: 46px 20px; text-align: center; color: var(--muted); background: var(--surface); border-radius: 14px; border: 1px dashed var(--line); grid-column: 1 / -1; }
.empty .big { font-size: 2rem; display: block; margin-bottom: 8px; }

/* لوحة التحكم الجانبية */
.drawer-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s ease; backdrop-filter: blur(3px); }
.drawer-scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; bottom: 0; right: 0; width: min(400px, 94vw); background: var(--surface); border-left: 1px solid var(--line); z-index: 61; transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: var(--shadow); }
.drawer.open { transform: translateX(0); }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.drawer-title { font-size: 1.05rem; font-weight: 700; }
.drawer-sub { font-size: .74rem; color: var(--muted); margin-top: 1px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 16px; align-content: start; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--surface-card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat .num { font-family: var(--mono); font-size: 1.32rem; font-weight: 700; }
.stat .lbl { font-size: .72rem; color: var(--muted); margin-top: 2px; }
.stat.clean .num { color: var(--on); }
.stat.on .num { color: var(--accent); }
.stat.hold .num { color: var(--hold); }
.stat.off .num { color: var(--off); }

.drawer-section { display: grid; gap: 8px; }
.drawer-section-head { display: flex; justify-content: space-between; align-items: center; font-size: .84rem; font-weight: 700; color: var(--fg); }
.drawer-section-head b { font-family: var(--mono); font-size: .74rem; color: var(--muted); background: var(--bg); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }
.mini-list { display: grid; gap: 6px; max-height: 220px; overflow-y: auto; }
.mini-item { background: var(--surface-card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; display: grid; gap: 1px; }
.mini-item .mi-phone { font-family: var(--mono); font-size: .9rem; font-weight: 700; direction: ltr; }
.mini-item .mi-meta { font-size: .72rem; color: var(--muted); display: flex; justify-content: space-between; }

.drawer-actions { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }

.overlay { position: fixed; inset: 0; z-index: 70; background: rgba(8,18,26,.75); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 14px; }
.overlay[hidden] { display: none; }
.dlg { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 18px; display: grid; gap: 13px; border: 1px solid var(--line); }
.dlg h2 { margin: 0; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.field { display: grid; gap: 5px; }
.field label { font-size: .8rem; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 13px; color: var(--fg); font-size: .93rem; }
.field textarea { min-height: 75px; resize: vertical; }
.field input.ltr { direction: ltr; text-align: right; font-family: var(--mono); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
.actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 11px; z-index: 90; font-size: .88rem; box-shadow: 0 6px 20px rgba(0,0,0,.35); display: flex; align-items: center; gap: 12px; max-width: min(92vw, 480px); animation: toastIn .25s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 18px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="titlebar">
      <div class="title-left">
        <button class="icon-btn" id="menuBtn" type="button">☰<span class="dot" id="menuDot" style="display:none;">0</span></button>
        <div>
          <h1>سجل الشرائح والاشتراكات</h1>
          <div class="sub" id="summary">جاري التحميل…</div>
        </div>
      </div>
      <div class="btns">
        <button class="icon-btn" id="themeBtn" type="button">🌙</button>
        <button class="icon-btn accent" id="addBtn" type="button">＋</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <select class="sort-select" id="sortSel">
        <option value="smart">الأقرب موعداً أولاً</option>
        <option value="name">الاسم (أ-ي)</option>
      </select>
    </div>

    <div class="search">
      <input id="q" type="search" placeholder="ابحث برقم الهاتف، الشريحة، أو اسم الزبون…" autocomplete="off">
      <span class="search-icon">🔍</span>
      <button class="clear-btn" id="clearQ" type="button">✕</button>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- لوحة التحكم الجانبية -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">لوحة التحكم والإدارة</div>
      <div class="drawer-sub">إحصائيات سريعة والنسخ الاحتياطي</div>
    </div>
    <button class="icon-btn" id="drawerClose" type="button">✕</button>
  </div>

  <div class="drawer-body">
    <div class="stat-grid" id="statGrid"></div>

    <div class="drawer-section">
      <div class="drawer-section-head"><span>🔔 تنبيهات اليوم</span><b id="alertsMiniCount">0</b></div>
      <div class="mini-list" id="alertsMiniList"></div>
    </div>

    <div class="drawer-actions">
      <button class="btn primary" id="exportJsonBtn" type="button">💾 تصدير النسخة الاحتياطية (JSON)</button>
      <button class="btn" id="importJsonBtn" type="button">📂 استيراد نسخة احتياطية</button>
      <input type="file" id="importJsonFile" accept=".json" style="display:none;">
    </div>
  </div>
</aside>

<!-- نافذة إضافة أو تعديل شريحة -->
<div class="overlay" id="overlay" hidden>
  <form class="dlg" id="form" novalidate>
    <h2><span id="dlgTitle">تعديل شريحة</span><button class="btn sm" type="button" id="closeDlg">إغلاق</button></h2>

    <div class="field"><label for="f-name">اسم المشترك / الزبون</label><input id="f-name" type="text"></div>
    <div class="two">
      <div class="field"><label for="f-phone">رقم الهاتف</label><input id="f-phone" class="ltr" type="text" placeholder="05XXXXXXXX"></div>
      <div class="field"><label for="f-company">الشركة</label><input id="f-company" type="text" placeholder="سلكوم / هوت / بلفون..."></div>
    </div>
    <div class="two">
      <div class="field"><label for="f-sim">رقم الشريحة (SIM)</label><input id="f-sim" class="ltr" type="text" placeholder="8997…"></div>
      <div class="field"><label for="f-status">الحالة</label>
        <select id="f-status"><option value="clean">🟢 نظيفة (غير مستعملة)</option><option value="active">مفعل</option><option value="suspended">معلق</option><option value="disconnected">مفصول</option></select>
      </div>
    </div>
    <div class="field"><label for="f-date">موعد الفصل</label><input id="f-date" type="date"></div>
    <div class="field"><label for="f-notes">ملاحظات</label><textarea id="f-notes"></textarea></div>

    <div style="color:var(--danger);font-size:.83rem;min-height:1.1em;" id="err"></div>
    <div class="actions">
      <button class="btn primary" type="submit" style="flex:2;">حفظ</button>
      <button class="btn danger" type="button" id="delBtn" hidden>حذف</button>
    </div>
  </form>
</div>

  function init() {
    var savedTheme = localStorage.getItem(THEME_KEY) || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
    themeBtn.textContent = savedTheme === "dark" ? "🌙" : "☀️";

    var stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try { sims = JSON.parse(stored); } catch(e) { sims = INITIAL_DATA; }
    } else {
      sims = INITIAL_DATA;
      saveData();
    }

    bindEvents();
    render();
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sims));
  }

  function showToast(msg) {
    var existing = document.querySelector(".toast");
    if (existing) existing.remove();
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 3000);
  }

  themeBtn.addEventListener("click", function() {
    var current = document.documentElement.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem(THEME_KEY, next);
    themeBtn.textContent = next === "dark" ? "🌙" : "☀️";
  });

  menuBtn.addEventListener("click", function() {
    drawer.classList.add("open");
    drawerScrim.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
  });
  function closeDrawer() {
    drawer.classList.remove("open");
    drawerScrim.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
  }
  drawerClose.addEventListener("click", closeDrawer);
  drawerScrim.addEventListener("click", closeDrawer);

  addBtn.addEventListener("click", function() { openEditor(null); });
  closeDlg.addEventListener("click", function() { overlay.hidden = true; });
  overlay.addEventListener("click", function(e) { if(e.target === overlay) overlay.hidden = true; });

  function bindEvents() {
    searchInput.addEventListener("input", function(e) {
      currentSearch = e.target.value.trim();
      clearQBtn.classList.toggle("show", currentSearch.length > 0);
      renderGrid();
    });
    clearQBtn.addEventListener("click", function() {
      searchInput.value = "";
      currentSearch = "";
      clearQBtn.classList.remove("show");
      renderGrid();
    });
    sortSel.addEventListener("change", function(e) {
      currentSort = e.target.value;
      renderGrid();
    });

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      saveItem();
    });

    delBtn.addEventListener("click", function() {
      if(editingId !== null && confirm("هل تريد حذف هذه الشريحة نهائياً؟")) {
        sims.splice(editingId, 1);
        saveData();
        overlay.hidden = true;
        render();
        showToast("تم الحذف.");
      }
    });

    exportJsonBtn.addEventListener("click", function() {
      var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sims, null, 2));
      var dl = document.createElement("a");
      dl.setAttribute("href", dataStr);
      dl.setAttribute("download", "sim_database_backup_" + new Date().toISOString().slice(0,10) + ".json");
      document.body.appendChild(dl); dl.click(); dl.remove();
      showToast("💾 تم تصدير النسخة الاحتياطية");
    });

    importJsonBtn.addEventListener("click", function() { importJsonFile.click(); });
    importJsonFile.addEventListener("change", function(e) {
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        try {
          var parsed = JSON.parse(evt.target.result);
          if(Array.isArray(parsed)) {
            sims = parsed;
            saveData();
            render();
            showToast("📂 تم استيراد البيانات بنجاح!");
            closeDrawer();
          } else { alert("ملف غير صالح."); }
        } catch(err) { alert("خطأ في قراءة الملف."); }
        importJsonFile.value = "";
      };
      reader.readAsText(file);
    });
  }

  function render() {
    renderTabs();
    renderGrid();
    updateStats();
  }

  function renderTabs() {
    var counts = { all: sims.length, clean: 0, active: 0, suspended: 0, disconnected: 0, alerts: 0 };
    var todayStr = new Date().toISOString().slice(0, 10);

    sims.forEach(function(i) {
      if(counts[i.status] !== undefined) counts[i.status]++;
      if(i.cutDate && i.cutDate === todayStr && i.status !== 'disconnected') counts.alerts++;
    });

    var html = `
      <button class="tab" aria-pressed="${currentFilter==='all'}" data-filter="all">الكل <b>${counts.all}</b></button>
      <button class="tab" aria-pressed="${currentFilter==='clean'}" data-filter="clean">🟢 نظيفة <b>${counts.clean}</b></button>
      <button class="tab" aria-pressed="${currentFilter==='active'}" data-filter="active">مفعل <b>${counts.active}</b></button>
      <button class="tab" aria-pressed="${currentFilter==='suspended'}" data-filter="suspended">معلق <b>${counts.suspended}</b></button>
      <button class="tab" aria-pressed="${currentFilter==='disconnected'}" data-filter="disconnected">مفصول <b>${counts.disconnected}</b></button>
      <button class="tab alert-tab" aria-pressed="${currentFilter==='alerts'}" data-filter="alerts">🔔 تنبيهات اليوم <b>${counts.alerts}</b></button>
    `;
    tabsEl.innerHTML = html;

    tabsEl.querySelectorAll(".tab").forEach(function(btn) {
      btn.addEventListener("click", function() {
        currentFilter = btn.getAttribute("data-filter");
        renderTabs();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    var todayStr = new Date().toISOString().slice(0, 10);
    var list = sims.map(function(item, idx) {
      return Object.assign({}, item, { originalIndex: idx });
    });

    if(currentFilter === "alerts") {
      list = list.filter(function(i) { return i.cutDate === todayStr && i.status !== 'disconnected'; });
    } else if(currentFilter !== "all") {
      list = list.filter(function(i) { return i.status === currentFilter; });
    }

    if(currentSearch) {
      var q = currentSearch.toLowerCase();
      list = list.filter(function(i) {
        return (i.phone && i.phone.toLowerCase().includes(q)) ||
               (i.sim && i.sim.toLowerCase().includes(q)) ||
               (i.name && i.name.toLowerCase().includes(q)) ||
               (i.company && i.company.toLowerCase().includes(q));
      });
    }

    list.sort(function(a, b) {
      if(currentSort === "name") return (a.name || "").localeCompare(b.name || "ع");
      return (a.cutDate || "9999").localeCompare(b.cutDate || "9999");
    });

    summaryEl.textContent = "إجمالي السجلات: " + sims.length + " (المعروض: " + list.length + ")";

    if(list.length === 0) {
      gridEl.innerHTML = `<div class="empty"><span class="big">📭</span>لا توجد عناصر مطابقة للعرض.</div>`;
      return;
    }

    var html = "";
    list.forEach(function(item) {
      var statusName = item.status === "clean" ? "🟢 نظيفة" : (item.status === "active" ? "مفعل" : (item.status === "suspended" ? "معلق" : "مفصول"));
      var isTodayAlert = item.cutDate === todayStr && item.status !== 'disconnected';

      html += `
        <div class="card ${item.status} ${isTodayAlert ? 'urgent' : ''}">
          <div class="card-header">
            <div class="phone-wrap">
              <span class="phone-lg">${item.phone || item.sim || 'بدون رقم'}</span>
              ${(item.phone || item.sim) ? `<button class="copy-btn" title="نسخ الرقم" onclick="navigator.clipboard.writeText('${item.phone || item.sim}')">📋</button>` : ''}
            </div>
            <div class="badge-tags">
              ${isTodayAlert ? `<span class="badge alert">⚠️ تنبيه اليوم</span>` : ''}
              <span class="badge ${item.status}">${statusName}</span>
              ${item.company ? `<span class="badge company">${item.company}</span>` : ''}
            </div>
          </div>
          <div class="card-body">
            <div class="name-row">
              <span>${item.name || 'بدون اسم'}</span>
              ${item.sim && item.phone ? `<span class="sim-row">SIM: ${item.sim}</span>` : ''}
            </div>
            ${item.notes ? `<div class="notes-box">📝 ${item.notes}</div>` : ''}
          </div>
          <div class="date-row">
            <span>📅 موعد الفصل: <span class="date-val">${item.cutDate || 'بدون موعد'}</span></span>
            <div class="card-actions">
              <button class="action-btn edit" onclick="editItem(${item.originalIndex})">✏️ تعديل</button>
              ${item.phone ? `<a class="action-btn call" href="tel:${item.phone}">📞 اتصال</a>` : ''}
              ${item.phone ? `<a class="action-btn wa" href="https://wa.me/972${item.phone.replace(/^0/,'')}" target="_blank">💬 واتساب</a>` : ''}
            </div>
          </div>
        </div>
      `;
    });
    gridEl.innerHTML = html;
  }

  function updateStats() {
    var cleanC = 0, actC = 0, suspC = 0, discC = 0, alertC = 0;
    var todayStr = new Date().toISOString().slice(0, 10);
    var alertList = [];

    sims.forEach(function(i) {
      if(i.status === 'clean') cleanC++;
      else if(i.status === 'active') actC++;
      else if(i.status === 'suspended') suspC++;
      else if(i.status === 'disconnected') discC++;

      if(i.cutDate && i.cutDate === todayStr && i.status !== 'disconnected') {
        alertC++;
        alertList.push({ name: i.name || i.phone, date: i.cutDate });
      }
    });

    document.getElementById("statGrid").innerHTML = `
      <div class="stat clean"><div class="num">${cleanC}</div><div class="lbl">🟢 نظيفة</div></div>
      <div class="stat on"><div class="num">${actC}</div><div class="lbl">مفعلة</div></div>
      <div class="stat hold"><div class="num">${suspC}</div><div class="lbl">معلقة</div></div>
      <div class="stat off"><div class="num">${discC}</div><div class="lbl">مفصولة</div></div>
    `;

    document.getElementById("alertsMiniCount").textContent = alertC;
    document.getElementById("menuDot").style.display = alertC > 0 ? "flex" : "none";
    document.getElementById("menuDot").textContent = alertC;

    var alertsHtml = "";
    if(alertC === 0) {
      alertsHtml = `<div class="mini-empty">لا توجد تنبيهات لفصل الشرائح اليوم</div>`;
    } else {
      alertList.forEach(function(a) {
        alertsHtml += `<div class="mini-item"><div class="mi-phone">${a.name}</div><div class="mi-meta"><span style="color:var(--danger)">تنتهي اليوم</span></div></div>`;
      });
    }
    document.getElementById("alertsMiniList").innerHTML = alertsHtml;
  }

  window.editItem = function(idx) { openEditor(idx); };

  function openEditor(idx) {
    editingId = idx;
    errEl.textContent = "";
    if(idx !== null) {
      var item = sims[idx];
      dlgTitle.textContent = "تعديل شريحة";
      document.getElementById("f-name").value = item.name || "";
      document.getElementById("f-phone").value = item.phone || "";
      document.getElementById("f-company").value = item.company || "";
      document.getElementById("f-sim").value = item.sim || "";
      document.getElementById("f-status").value = item.status || "active";
      document.getElementById("f-date").value = item.cutDate || "";
      document.getElementById("f-notes").value = item.notes || "";
      delBtn.hidden = false;
    } else {
      dlgTitle.textContent = "إضافة شريحة جديدة";
      form.reset();
      document.getElementById("f-status").value = "active";
      delBtn.hidden = true;
    }
    overlay.hidden = false;
  }

  function saveItem() {
    var name = document.getElementById("f-name").value.trim();
    var phone = document.getElementById("f-phone").value.trim();
    var company = document.getElementById("f-company").value.trim();
    var sim = document.getElementById("f-sim").value.trim();
    var status = document.getElementById("f-status").value;
    var cutDate = document.getElementById("f-date").value;
    var notes = document.getElementById("f-notes").value.trim();

    if(!phone && !sim && !name) {
      errEl.textContent = "يرجى إدخال اسم أو رقم هاتف على الأقل.";
      return;
    }

    var record = {
      name: name,
      phone: phone,
      sim: sim,
      company: company,
      status: status,
      cutDate: cutDate,
      notes: notes
    };

    if(editingId !== null) {
      sims[editingId] = record;
    } else {
      sims.unshift(record);
    }

    saveData();
    overlay.hidden = true;
    render();
    showToast("تم الحفظ بنجاح!");
  }

  init();
})();
</script>
</body>
</html>
